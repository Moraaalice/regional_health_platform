name: Phase 3 - security gates

on:
  pull_request:
  push:
    branches:
      - main
      - phase3-ci-security

permissions:
  contents: read

env:
  IMAGE_TAG: regional-health:ci-${{ github.sha }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-config:
    name: trivy-config
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          output: trivy-config.txt

      - name: Upload Trivy config report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-report
          path: trivy-config.txt

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install zizmor
        run: python -m pip install --user zizmor

      - name: Run zizmor
        run: |
          set -o pipefail
          ~/.local/bin/zizmor --format plain .github/workflows | tee zizmor.txt

      - name: Upload zizmor report
        uses: actions/upload-artifact@v4
        with:
          name: zizmor-report
          path: zizmor.txt

  localstack-terraform:
    name: localstack-terraform
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_aiven_api_token: ${{ secrets.AIVEN_API_TOKEN }}
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Start LocalStack in runner
        run: |
          docker run -d --rm --name localstack \
            -e SERVICES=secretsmanager \
            -e DEBUG=1 \
            -e LOCALSTACK_AUTH_TOKEN="${LOCALSTACK_AUTH_TOKEN}" \
            -p 4566:4566 \
            localstack/localstack:latest

          for i in $(seq 1 30); do
            curl -fsS http://localhost:4566/_localstack/health >/dev/null && break
            sleep 2
          done

          curl -fsS http://localhost:4566/_localstack/health

      - name: Install tflocal
        run: python -m pip install terraform-local

      - name: Terraform fmt and validate
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

      - name: Terraform plan/apply in LocalStack dev root
        run: |
          cd terraform/envs/dev
          tflocal init
          tflocal plan
          tflocal apply -auto-approve

  docker-build-scan:
    name: docker-build-scan
    runs-on: ubuntu-latest
    needs: [localstack-terraform]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "${IMAGE_TAG}" .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          output: trivy-image.txt

      - name: Save image digest
        run: |
          docker image inspect "${IMAGE_TAG}" --format '{{index .RepoDigests 0}}' > image-digest.txt || \
          docker image inspect "${IMAGE_TAG}" --format '{{.Id}}' > image-digest.txt

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt

      - name: Upload Trivy image report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.txt

  terraform-validate:
    name: terraform-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir=terraform init -backend=false && terraform -chdir=terraform validate
